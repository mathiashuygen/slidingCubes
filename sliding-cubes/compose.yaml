services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    init: true

volumes:
  node_modules:
  next_cache:
